    <script>
        function createBubbles() {
            const bubblesContainer = document.getElementById('bubbles');
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.width = `${20 + Math.random() * 30}px`;
                bubble.style.height = bubble.style.width;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                bubble.style.animationDuration = `${5 + Math.random() * 5}s`;
                bubblesContainer.appendChild(bubble);
            }
        }

        // متابعة حركة الماوس للعيون
        document.addEventListener('mousemove', (e) => {
            const leftPupil = document.getElementById('leftPupil');
            const rightPupil = document.getElementById('rightPupil');
            const character = document.getElementById('character');
            
            // حساب موقع الماوس بالنسبة للشخصية
            const characterRect = character.getBoundingClientRect();
            const characterCenterX = characterRect.left + characterRect.width / 2;
            const characterCenterY = characterRect.top + characterRect.height / 2;
            
            // حساب زاوية النظر
            const angleX = (e.clientX - characterCenterX) / 50;
            const angleY = (e.clientY - characterCenterY) / 50;
            
            // تطبيق الحركة على العيون
            leftPupil.style.transform = `translate(${Math.min(Math.max(angleX, -5), 5)}px, ${Math.min(Math.max(angleY, -5), 5)}px)`;
            rightPupil.style.transform = `translate(${Math.min(Math.max(angleX, -5), 5)}px, ${Math.min(Math.max(angleY, -5), 5)}px)`;
        });

        // تسجيل الدخول الحقيقي
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            const errorText = document.getElementById('errorText');
            const character = document.getElementById('character');
            const mouth = document.getElementById('mouth');
            const arms = document.getElementById('arms');
            const characterMessage = document.getElementById('characterMessage');
            
            // إخفاء الرسائل السابقة
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // تعطيل الزر
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري تسجيل الدخول...';
            
            // جمع بيانات النموذج
            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            
            // إرسال طلب AJAX
            fetch('login_api.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // تسجيل الدخول ناجح
                    successDiv.style.display = 'block';
                    document.getElementById('successText').textContent = data.message;
                    
                    // تفاعل الشخصية مع النجاح
                    character.classList.add('celebrating');
                    mouth.classList.remove('sad-mouth');
                    mouth.classList.add('happy-mouth');
                    characterMessage.textContent = 'أهلاً وسهلاً! تم تسجيل الدخول بنجاح';
                    characterMessage.style.color = '#10b981';
                    
                    // إعادة التوجيه بعد فترة
                    setTimeout(() => {
                        if (data.redirect) {
                            window.location.href = data.redirect;
                        } else {
                            window.location.href = 'Home1.html';
                        }
                    }, 2000);
                } else {
                    // فشل تسجيل الدخول
                    errorText.textContent = data.message;
                    errorDiv.style.display = 'block';
                    
                    // تفاعل الشخصية مع الفشل
                    character.classList.remove('celebrating');
                    character.classList.add('rejecting');
                    mouth.classList.remove('happy-mouth');
                    mouth.classList.add('sad-mouth');
                    characterMessage.textContent = 'بيانات الدخول غير صحيحة!';
                    characterMessage.style.color = '#ef4444';
                    
                    // إعادة تعيين الزر
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'تسجيل الدخول';
                    
                    // إزالة تأثير الرفض بعد فترة
                    setTimeout(() => {
                        character.classList.remove('rejecting');
                    }, 1000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorText.textContent = 'حدث خطأ في الاتصال بالخادم';
                errorDiv.style.display = 'block';
                
                // إعادة تعيين الزر
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الدخول';
            });
        });

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            createBubbles();
            
            // جعل الشخصية تلوح في البداية
            const character = document.getElementById('character');
            character.classList.add('waving');
            
            setTimeout(() => {
                character.classList.remove('waving');
            }, 3000);
        });
    </script>
